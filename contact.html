<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты | Моя Визитка</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container nav">
      <div class="logo">MyBrand</div>
      <button class="burger" aria-label="Меню">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">О нас</a></li>
        <li><a href="services.html">Услуги</a></li>
        <li><a href="portfolio.html">Портфолио</a></li>
        <li><a href="contact.html" class="active">Контакты</a></li>
      </ul>
    </div>
  </header>

  <section>
    <div class="container">
      <h2 class="section-title">Свяжитесь с нами</h2>
      <form class="contact-form" id="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Имя</label>
          <input type="text" id="name" name="name" placeholder="Ваше имя" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="message">Сообщение</label>
          <textarea id="message" name="message" placeholder="Расскажите о вашем проекте..." required></textarea>
        </div>
        <button type="submit" class="btn">Отправить</button>
        <div class="form-message" id="formMessage"></div>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 MyBrand. Все права защищены. | <a href="contact.html">Связаться</a></p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
